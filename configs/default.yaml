schema_version: "1.0.0"

pdk:
  name: "sky130"
  variant: "sky130_fd_sc_hd"
  std_cell_library: "sky130_fd_sc_hd"
  pdk_root: "/usr/local/share/pdk"

constraints:
  clock_period: 10.0
  clock_port: "clk"
  clock_uncertainty: 0.25
  input_delay: 2.0
  output_delay: 2.0
  time_unit: "ns"
  cap_unit: "pF"

physical:
  core_utilization: 0.35
  core_aspect_ratio: 1.0
  core_margin: 10.0

synthesis:
  strategy: "AREA"
  flatten: true
  abc_clock_period: 10000.0

flow:
  stages:
    - rtl_simulation
    - synthesis
    - floorplan
    - power_planning
    - placement
    - cts
    - routing
    - sta
    - gds_export
  timeouts:
    rtl_simulation: 120
    synthesis: 300
    floorplan: 180
    power_planning: 180
    placement: 300
    cts: 300
    routing: 600
    sta: 180
    drc: 300
    lvs: 300
    gds_export: 180
  fail_fast: true
