name: AutoSilix Test Suite

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: Unit & Integration Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Ruff Linting
        run: |
          ruff check src tests

      - name: Run Pytest Suite
        run: |
          pytest -v tests/

      - name: Test AutoSilix CLI commands
        run: |
          python -m autosilix.cli --version
          python -m autosilix.cli --help
          python -m autosilix.cli tools
          python -m autosilix.cli validate --config configs/designs/sequence_detector.yaml
          python -m autosilix.cli run --config configs/designs/sequence_detector.yaml --mock
          python -m autosilix.cli validate --config configs/designs/alu_accumulator.yaml
          python -m autosilix.cli run --config configs/designs/alu_accumulator.yaml --mock
